# Unit tests for the .NET runners this repo ships from tools/.
#
# lint-workflows covers the YAML and the bash pathspec suite, but its paths filter
# lists only .github/workflows, .github/actions, .github/scripts and templates. Nothing
# matched tools/**, so a pull request touching only the runners received no checks at
# all: PR #131 reported zero. That left every runner regression test inert, including the
# one added in #131 to stop the System.Drawing.Common reference being dropped as unused.
#
# ComplianceRunner's tests are split across two projects, and only one of them can run here.
#
# Compliance.Unit.Tests DOES run: it compiles Annotation.cs, ArgParser.cs, FileFilter.cs and
# SarifBuilder.cs directly, references no BHoM assembly, and so needs nothing installed.
#
# Compliance.Tests is still NOT run. It ProjectReferences Compliance.Shared, which references
# BHoM.dll, BHoM_Engine.dll, CodeComplianceTest_oM.dll, Test_Engine.dll and Test_oM.dll by
# HintPath out of C:\ProgramData\BHoM\Assemblies. The blocker is narrower than the whole set:
# measured on a machine with the BHoM installer present, four of the five resolve and only
# CodeComplianceTest_oM.dll is missing, because it ships with Test_Toolkit rather than in the
# installer payload. AnnotationConvert.cs then fails with CS0234 on BH.oM.Test.CodeCompliance
# and takes the whole project with it. Running it therefore needs resolve-dependencies to
# build Test_Toolkit first, which belongs in a separate change; a job that fails for
# environmental reasons is worse than no job.
name: Test Tools

on:
  pull_request:
    paths:
      - 'tools/**'
  # The pull request that introduces this file touches only .github/workflows, so it
  # cannot trigger itself. Dispatch is how you validate it before relying on it.
  workflow_dispatch:

concurrency:
  group: test-tools-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet-tests:
    name: dotnet tests
    # windows-latest rather than ubuntu-latest. The runners are Windows-only in
    # production (ProgramData paths, Revit assemblies), and HostDependencyTests asserts
    # a property of the host rather than of the code, so it is only meaningful on the
    # host the runners actually execute on.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Two versions: the Serialiser and Versioning suites target net8.0-windows, matching
      # their runners; Compliance.Unit.Tests targets net10.0, matching ComplianceRunner.
      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: |
            8.0
            10.x

      - name: SerialiserRunner tests
        run: dotnet test tools/SerialiserRunner/src/SerialiserRunner.Tests --nologo

      - name: VersioningRunner tests
        run: dotnet test tools/VersioningRunner/src/VersioningRunner.Tests --nologo

      - name: ComplianceRunner unit tests (BHoM-free)
        run: dotnet test tools/ComplianceRunner/tests/Compliance.Unit.Tests --nologo
