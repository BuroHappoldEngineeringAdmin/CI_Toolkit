name: Debug App Credentials

# Diagnostic workflow. Run manually from the Actions tab to verify that
# BHOM_APP_ID and BHOM_APP_PRIVATE_KEY are reachable in this repo's
# workflow context and that create-github-app-token can mint successfully.
#
# Safe to delete once App credentials are confirmed healthy.

on:
  workflow_dispatch:
    inputs:
      owner:
        type: string
        required: false
        default: ''
        description: >
          Org to mint the token for (e.g. BuroHappoldEngineeringSandbox).
          Defaults to github.repository_owner if left blank.

jobs:
  debug-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret availability
        id: secret-check
        env:
          APP_ID: ${{ secrets.BHOM_APP_ID }}
          APP_KEY: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
        run: |
          echo "=== Secret availability ==="
          echo "BHOM_APP_ID length:          ${#APP_ID}"
          echo "BHOM_APP_PRIVATE_KEY length:  ${#APP_KEY}"

          if [ -z "$APP_ID" ]; then
            echo "::error::BHOM_APP_ID is empty: the secret is not reachable from this workflow context."
            echo "  Check that BHOM_APP_ID is stored under org Settings -> Secrets and variables -> Actions"
            echo "  (Secrets, not Variables) and that this repo is in the access list."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::BHOM_APP_ID is present (length ${#APP_ID})."
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$APP_KEY" ]; then
            echo "::error::BHOM_APP_PRIVATE_KEY is empty: the secret is not reachable from this workflow context."
          else
            echo "::notice::BHOM_APP_PRIVATE_KEY is present (length ${#APP_KEY})."
            # Sanity-check the PEM header.
            if echo "$APP_KEY" | grep -q "BEGIN"; then
              echo "::notice::PEM header detected, key format looks correct."
            else
              echo "::warning::No PEM header found in BHOM_APP_PRIVATE_KEY: key may be malformed (escaped newlines, base64-encoded, etc.)."
            fi
          fi

      - name: Mint App token
        id: app-token
        if: steps.secret-check.outputs.available == 'true'
        uses: actions/create-github-app-token@07e2b760664f080c40eec4eacf7477256582db36 # v3.1.1
        with:
          client-id: ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner || github.repository_owner }}

      - name: Verify minted token
        if: steps.secret-check.outputs.available == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_OWNER: ${{ inputs.owner || github.repository_owner }}
        run: |
          echo "=== Token mint result ==="
          if [ -z "$TOKEN" ]; then
            echo "::error::Token is empty: create-github-app-token ran but produced no output."
            echo "  Likely causes: wrong App ID, expired/malformed private key, App not installed in '$TARGET_OWNER'."
            exit 1
          fi

          echo "::notice::Token minted successfully for org: $TARGET_OWNER"
          TOKEN_LENGTH=${#TOKEN}
          echo "Token length: $TOKEN_LENGTH"

          echo ""
          echo "=== Token scope verification ==="
          RESPONSE=$(curl -sf -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/installation/repositories?per_page=5" 2>&1) || true

          if echo "$RESPONSE" | grep -q '"repositories"'; then
            REPO_COUNT=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total_count','unknown'))" 2>/dev/null || echo "unknown")
            echo "::notice::Token can list installation repositories (total_count: $REPO_COUNT)."
          else
            echo "::warning::Could not list installation repositories. Response: $RESPONSE"
          fi
