name: Mint dependency token
description: >
  Mints a short-lived cross-org token via the GitHub App, falling back
  to a PAT or the ephemeral github.token when App credentials are not
  configured. Centralises the token resolution pattern used by every
  workflow that clones private dependency repositories.

inputs:
  app_id:
    description: GitHub App client ID (BHOM_APP_ID secret).
    required: false
    default: ''
  private_key:
    description: GitHub App PEM private key (BHOM_APP_PRIVATE_KEY secret).
    required: false
    default: ''
  fallback_token:
    description: >
      Token to use when the App is not configured. Callers typically
      pass `secrets.GH_TOKEN || github.token`.
    required: false
    default: ''
  owner:
    description: >
      Organisation the App installation token is scoped to. Defaults to the
      calling repository's owner, which is right for dependencies living in
      the caller's own org. Override when a dependency is private and lives
      elsewhere: a token scoped to the caller's org cannot read it, and the
      clone fails with a bare "could not clone" that looks like a missing
      repo rather than a scope problem. Requires the App to be installed on
      the named owner, so callers overriding this should tolerate failure.
    required: false
    default: ''

outputs:
  token:
    description: Token suitable for cloning private dependency repositories.
    value: ${{ steps.pick.outputs.token }}

runs:
  using: composite
  steps:
    - name: Generate App token
      id: app-token
      if: inputs.app_id != ''
      uses: actions/create-github-app-token@07e2b760664f080c40eec4eacf7477256582db36 # v3.1.1
      with:
        client-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}
        owner: ${{ inputs.owner || github.repository_owner }}

    - name: Pick token
      id: pick
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        FALLBACK:  ${{ inputs.fallback_token }}
      run: |
        if [ -n "$APP_TOKEN" ]; then
          echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
        else
          echo "token=$FALLBACK" >> "$GITHUB_OUTPUT"
        fi
